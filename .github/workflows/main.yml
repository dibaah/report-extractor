name: Build Windows Archive

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name CTEP-Shift-Report-Archive --collect-all uvicorn --hidden-import app --hidden-import extractor --hidden-import export_service --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.protocols --hidden-import uvicorn.lifespan run_archive.py
      - name: Include launcher and instructions
        shell: pwsh
        run: |
          Copy-Item start_archive.bat dist/CTEP-Shift-Report-Archive/
          Copy-Item README.md dist/CTEP-Shift-Report-Archive/
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path dist/CTEP-Shift-Report-Archive/* -DestinationPath CTEP-Shift-Report-Archive-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CTEP-Shift-Report-Archive-Windows
          path: CTEP-Shift-Report-Archive-Windows.zip
